name: Build APK

# Builds the phone app on every push (and on demand from the Actions tab).
# The APK is attached to the run as an artifact named "openzeekr-apk".
#
# Optional signing (recommended, so new builds install as updates instead of needing an uninstall):
# add these repository secrets under Settings > Secrets and variables > Actions:
#   KEYSTORE_BASE64    base64 of your .jks keystore
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# Without them the APK is signed with a throwaway debug key that changes every run.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Install the SDK straight from Google (no third-party setup action).
      - name: Install Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          (yes | "$SM" --licenses > /dev/null) || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set - building a debug APK with a throwaway key. Each build will need an uninstall before installing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Tests + APK in one Gradle run (--continue shows every error in one pass). Output is kept in
      # build.log so the next step can surface the errors as annotations.
      - name: Test and build APK
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then TASK=":app:assembleRelease"; else TASK=":app:assembleDebug"; fi
          set +e
          ./gradlew --no-daemon --continue :core:testDebugUnitTest "$TASK" 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          try:
              lines = open("build.log", errors="replace").read().splitlines()
          except FileNotFoundError:
              raise SystemExit(0)
          keep = []
          for i, l in enumerate(lines):
              if re.match(r"^e: ", l) or "FAILED" in l or re.search(r"\b(Exception|AssertionError|expected:)", l) \
                      or l.startswith("* What went wrong") or re.match(r"^\S+Test > ", l):
                  keep.extend(lines[i:i + (6 if l.startswith("* What went wrong") else 2)])
          seen, out = set(), []
          for l in keep:
              if l not in seen:
                  seen.add(l); out.append(l)
          msg = "\n".join(out)[:12000] or "\n".join(lines[-60:])
          for n, chunk in enumerate([msg[i:i + 3500] for i in range(0, len(msg), 3500)][:8]):
              body = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Build errors part {n + 1}::{body}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: openzeekr-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
