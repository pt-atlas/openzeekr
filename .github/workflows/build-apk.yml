name: Build APK

# Builds the phone app on every push (and on demand from the Actions tab).
# The APK is attached to the run as an artifact named "openzeekr-apk".
#
# Optional signing (recommended, so new builds install as updates instead of needing an uninstall):
# add these repository secrets under Settings > Secrets and variables > Actions:
#   KEYSTORE_BASE64    base64 of your .jks keystore
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# Without them the APK is signed with a throwaway debug key that changes every run.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (automation engine and existing core tests)
        run: ./gradlew --no-daemon :core:testDebugUnitTest

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set - building a debug APK with a throwaway key. Each build will need an uninstall before installing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: openzeekr-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
